    <h1 class="section-title">Contact me</h1>
    <!--! Functional form: opens email app on submit -->
    <!--! Replace you@email.com with your real email -->
    <form class="contact-form panel" action="mailto:you@email.com" method="post" enctype="text/plain">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="user_name" required minlength="2" placeholder="Your name">
        </div>
        <div class="form-group">
            <label for="mail">Email:</label>
            <input type="email" id="mail" name="user_email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label for="msg">Message:</label>
            <textarea id="msg" name="user_message" required minlength="10" rows="5"
                placeholder="Write your message..."></textarea>
        </div>
        <button type="submit" class="submit-btn">Send ➜</button>
    </form>
